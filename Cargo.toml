[package]
name = "qstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Low-latency finance + signal-processing feature library (Rust core, Python API)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "_qstream"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# Heavy/experimental algorithms (Tier C). Off by default to keep the core lean.
experimental = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
lto = "fat"
codegen-units = 1
